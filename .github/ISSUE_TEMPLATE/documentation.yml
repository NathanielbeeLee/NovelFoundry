name: Documentation improvement
description: Report unclear, outdated, or missing project documentation.
title: "[Docs] "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Document or page
      placeholder: docs/public/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested correction
